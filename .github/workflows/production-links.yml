name: Production Links

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-links:
    name: Check usewraith.xyz links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check production links
        run: pnpm check:links --base https://usewraith.xyz --report link-check-report.json

      - name: Upload link check report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-link-check-report
          path: link-check-report.json
          if-no-files-found: ignore
          retention-days: 14
